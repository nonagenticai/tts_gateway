[project]
license = "Apache-2.0"
name = "tts-gateway"
version = "0.1.0"
description = "Pooling TTS gateway: a durable Postgres claim-queue that fans audiobook/narration synthesis across many remote kokoro workers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary,pool]>=3.3.9",
    "sqlalchemy[asyncio]>=2.1.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.0",
    "alembic>=1.18.0",
    "httpx>=0.28.0",
    "miniopy-async>=1.23.0",
    # >=0.75.0 for w2v_common.auth.entitlement (LICENSE_GATE) — the tenant
    # entitlement STATE gate on src/api/routes/batches.py depends on it.
    #
    # SECOND REASON THE FLOOR CANNOT DROP. worker/worker.py imports
    # EFFECTIVE_TENANT_HEADER from w2v_common.auth.outbound at MODULE level. That
    # module did not always exist: `git -C w2v_common log -S EFFECTIVE_TENANT_HEADER
    # -- src/w2v_common/auth/outbound.py` returns exactly one commit, b546a29
    # ("feat!: tenant is a required uuid", #127, 2026-08-26), which CREATES the file
    # (231 insertions, absent in b546a29^) and in the same commit sets
    # `version = "0.67.0"` (parent: 0.66.1). So 0.67.0 is the first release that
    # exports the symbol.
    #
    # 0.67.0 < 0.75.0, so the entitlement floor above ALREADY covers this import and
    # no raise is needed — the audit note that prompted this check assumed the symbol
    # was newer than 0.75.0; it is not (lock is 0.76.4). It is recorded here because
    # the consequence of getting it wrong is not a test failure: a relock that
    # resolved below the floor would ImportError at import of the container
    # entrypoint, i.e. an instant CrashLoop on both worker Deployments that the
    # SYNTH_EFFECTIVE_TENANT_ENABLED flag cannot make dark — the flag is read after
    # the import. Anyone lowering this floor for the entitlement reason must clear
    # 0.67.0 too.
    #
    # >=0.92.1 (P7): worker/worker.py imports service_cell_token_hook_sync (0.92.1)
    # and src/api/routes/workers.py uses require_cell_service_caller (0.92.0), whose
    # route lookup only sees include_router routes on FastAPI 0.141+ from 0.92.1 —
    # on 0.92.0 every worker service token is refused. Below it, the worker
    # ImportErrors at boot and enforce would 401 the whole worker fleet.
    "w2v-common>=0.92.1",
    # --- Security floors on transitive dependencies ---
    # Neither package is imported by this service directly; both arrive as
    # transitives (aiohttp via miniopy-async, cryptography via pyjwt and
    # w2v-common). The lock was already moved to safe versions fleet-wide, but
    # a lock is a point-in-time resolution: the next unrelated `uv lock` is
    # free to walk an undeclared transitive back DOWN, silently, with green CI.
    # The declared floor is the only thing that binds it. Regression-tested by
    # tests/unit/test_security_floors.py. Precedent: analysis_service #175/#176.
    #
    # aiohttp 3.14.1 was flagged by CVE-2026-59881 + CVE-2026-69243 (fixed in
    # 3.14.2) and CVE-2026-69244 (fixed in 3.14.3); 3.14.3 was then flagged by CVE-2026-111063,
    # CVE-2026-111064 + GHSA-2g87-pp6c-29x5 (fixed in 3.14.4).
    "aiohttp>=3.14.4",
    # cryptography: CVE-2026-69247 (GHSA-g6cj-pr64-35w5) was introduced in
    # 44.0.0 and fixed in 50.0.0, so the previously-locked 49.0.0 was affected.
    "cryptography>=50.0.0",
]

[project.scripts]
tts-gateway = "src.asgi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = [
    # miniopy-async (1.23.5, the LATEST) caps the CA-certificate bundle:
    #   certifi>=2025.1.31,<2026.0.0
    # That is lazy upper-bounding, not a real incompatibility -- certifi's entire
    # public API is where()/contents() and has been stable for years, while the
    # package's whole purpose is to ship CURRENT roots. Left alone the cap pins
    # every MinIO-using repo in this fleet to a trust store from Nov 2025, and no
    # relock cadence can move it (verified by making uv name the constraint).
    #
    # NOT overriding miniopy-async's argon2-cffi<24.0.0 alongside it: that is a
    # MAJOR bump with real API surface, so it needs its own testing rather than
    # riding along with a data-only package.
    "certifi>=2026.7.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "httpx>=0.28.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "pip-audit>=2.10.0",
    # pip is a transitive dep of pip-audit (pip-audit -> pip-api -> pip).
    # Explicit floor: pip < 26.2 is vulnerable to PYSEC-2026-3721.
    "pip>=26.2",
    "detect-secrets>=1.5.0",
    "bandit>=1.9.4",
    "pre-commit>=4.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "BLE", "A", "S", "C901", "RUF", "RET", "SIM", "ASYNC", "PTH", "TID251",]
ignore = ["E501", "B008" ]

# uuid7 is the id standard (stdlib, py3.14). TID251 bans `uuid4` in production
# code via ruff — enforced in CI (`ruff check .`), not only local pre-commit.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"uuid.uuid4".msg = "uuid7 is the w2v id standard — use uuid.uuid7() (stdlib, py3.14)."

[tool.ruff.lint.per-file-ignores]
"src/database/migrations/*" = ["I001", "ANN"]
"tests/*" = ["S101", "ANN", "TID251"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
# The published source tree resolves its shared library from the public
# repository at the release tag; the private index is not reachable here.
w2v-common = { git = "https://github.com/nonagenticai/w2v_common", tag = "v0.115.4" }
